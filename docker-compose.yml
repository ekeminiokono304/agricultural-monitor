version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host  # 🔥 FIX: Forces docker-compose to use your host's internet connection during build time
    container_name: agrivision-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
# ... leave the rest of your volume/network definitions as they are